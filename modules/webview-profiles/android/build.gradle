plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.example.messengersessions.webviewprofiles'
version = '0.1.0'

android {
  namespace 'expo.modules.webviewprofiles'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Match the major line already pulled by react-native-webview.
  implementation 'androidx.webkit:webkit:1.14.0'

  // ML-1: the pending-profile registry lives inside the patched
  // react-native-webview (profile binding must happen at WebView
  // creation time, which only that library controls).
  implementation project(':react-native-webview')
}
